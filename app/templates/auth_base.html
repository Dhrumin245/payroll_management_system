<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Payroll Management System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<!-- No navbar here on purpose: this layout is for the public Login screen
     and for error pages, which may render before/without an authenticated
     session (App Flow §2: the navbar shell applies to authenticated
     screens only). -->
<body class="auth-body">
    <div class="flash-container">
        {% for f in flashes %}
        <div class="flash flash--{{ f.category }}">
            <span>{{ f.message }}</span>
            <button type="button" class="flash__close" aria-label="Dismiss" onclick="this.parentElement.remove()">&times;</button>
        </div>
        {% endfor %}
    </div>

    <main class="auth-container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
