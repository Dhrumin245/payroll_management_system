<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Employee Portal — Payroll Management System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <nav class="app-navbar">
        <div class="app-navbar__brand">
            <a href="/portal">Employee Portal</a>
        </div>

        <button type="button" class="app-navbar__toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="app-navbar-links">
            <span></span><span></span><span></span>
        </button>

        <div class="app-navbar__links" id="app-navbar-links">
            <a href="/portal" class="{{ 'active' if active_nav == 'dashboard' else '' }}">Dashboard</a>
            <a href="/portal/payslips" class="{{ 'active' if active_nav == 'payslips' else '' }}">My Payslips</a>
            <a href="/portal/attendance" class="{{ 'active' if active_nav == 'attendance' else '' }}">My Attendance</a>
            <a href="/portal/leaves" class="{{ 'active' if active_nav == 'leaves' else '' }}">My Leaves</a>
            <a href="/portal/profile" class="{{ 'active' if active_nav == 'profile' else '' }}">My Profile</a>
        </div>

        <div class="app-navbar__user">
            <span>{{ user.username }}</span>
            <form method="post" action="/logout" class="app-navbar__logout-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <button type="submit" class="btn btn-secondary btn-sm">Log Out</button>
            </form>
        </div>
    </nav>

    <div class="flash-container">
        {% for f in flashes %}
        <div class="flash flash--{{ f.category }}">
            <span>{{ f.message }}</span>
            <button type="button" class="flash__close" aria-label="Dismiss" onclick="this.parentElement.remove()">&times;</button>
        </div>
        {% endfor %}
    </div>

    <main class="app-content">
        {% block content %}{% endblock %}
    </main>

    <script src="/static/js/nav.js"></script>
    <script src="/static/js/modal.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
