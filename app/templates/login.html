{% extends "auth_base.html" %}
{% block title %}Log In — Payroll Management System{% endblock %}
{% block content %}
<div class="auth-card">
    <h1 class="display-heading" style="font-size: 28px;">Payroll Management System</h1>

    <form method="post" action="/login">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next" value="{{ next }}">

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" value="{{ username or '' }}" class="form-control" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>
</div>
{% endblock %}
